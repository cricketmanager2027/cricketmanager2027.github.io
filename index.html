function domLogo(id){const c={CSK:['#f9a900','#163d8f','CSK','♛'],DC:['#1746c7','#e31837','DC','◆'],GT:['#162447','#d7b45b','GT','▲'],KKR:['#3d176f','#d7b53f','KKR','♞'],LSG:['#00a7e0','#f05a8c','LSG','★'],MI:['#0454b8','#00a6d6','MI','◉'],PBKS:['#ed1b2f','#fff','PBKS','♟'],RR:['#e91e63','#2f2a73','RR','R'],RCB:['#b20f22','#f4b23a','RCB','♛'],SRH:['#ff6a00','#f5c21b','SRH','☀'],'Adelaide Strikers':['#1595d3','#fff','STR','✦'],'Brisbane Heat':['#13a9aa','#fff','HEAT','B'],'Hobart Hurricanes':['#512c83','#fff','HUR','⚡'],'Melbourne Renegades':['#d71920','#fff','REN','R'],'Melbourne Stars':['#0b8f3c','#fff','STA','★'],'Perth Scorchers':['#f39a1e','#231f20','SCO','S'],'Sydney Sixers':['#e31d59','#fff','SIX','6'],'Sydney Thunder':['#b7e500','#111','THU','ϟ']};let x=c[id]||['#333','#fff',id.slice(0,3),'●'],bg=x[0],fg=x[1],label=x[2],mark=x[3];return '<div class="domLogo"><svg viewBox="0 0 100 100"><rect x="3" y="3" width="94" height="94" rx="20" fill="'+bg+'"/><circle cx="50" cy="42" r="25" fill="'+fg+'" opacity=".14"/><text x="50" y="47" text-anchor="middle" font-size="'+(label.length>3?18:25)+'" font-weight="900" fill="'+fg+'" font-family="Arial,sans-serif">'+mark+'</text><text x="50" y="75" text-anchor="middle" font-size="'+(label.length>3?12:16)+'" font-weight="900" fill="'+fg+'" font-family="Arial,sans-serif">'+label+'</text></svg></div>'}

function domesticLeague(){$('#app').innerHTML='<main><section class=l style="max-width:760px;margin:auto"><h2>Choose Competition</h2><p>Select a domestic league.</p><div class=grid><div class=tm onclick="domesticTeams(\'IPL\')">'+leagueLogo('IPL')+'<h2>IPL</h2><em>Indian Premier League</em></div><div class=tm onclick="domesticTeams(\'BBL\')">'+leagueLogo('BBL')+'<h2>BBL</h2><em>Big Bash League</em></div></div><button class=btn onclick=modeSelect()>← Back</button></section></main>'}
function domesticTeams(l){let d=DOM[l];$('#app').innerHTML='<main><section class=l style="max-width:980px;margin:auto"><div style="display:flex;align-items:center;gap:14px;margin-bottom:10px">'+leagueLogo(l)+'<div><h2 style="margin:0">Choose Your '+d.short+' Team</h2><em>Cartoon recreations based on the supplied team logos</em></div></div><div class=grid>'+d.teams.map(t=>'<div class="tm" onclick="startDomestic(\''+l+'\',\''+t.replace(/'/g,"\\'")+'\')">'+domLogo(t)+'<h3 style="margin:4px 0">'+(DT[t]||t)+'</h3><b>OVR '+(DOVR[t]||80)+'</b></div>').join('')+'</div><button class=btn onclick=domesticLeague()>← Back</button></section></main>'}
function startDomestic(l,team){let names=DP[team]||DB[team]||['Opening Batter','All-rounder','Strike Bowler'];G={mode:'domestic',league:l,team,teamName:DT[team]||team,season:2027,played:0,wins:0,losses:0,pts:0,fan:72,fanFlash:'',news:[],standings:{},manager:PN||'Coach'};DOM[l].teams.forEach(t=>G.standings[t]={p:0,w:0,l:0,pts:0});G.players=[...names,'Young Batter','Finisher','Keeper','Spinner','Fast Bowler'];domesticSeedNews();domesticRender()}
function domesticSeedNews(){let t=G.teamName,p=G.players[0],lg=DOM[G.league].short;G.news=[{h:`${t} begin their ${lg} campaign with high expectations`,b:`The new season is underway and ${p} is one of the players under the spotlight.`,src:'ESPNcricinfo',d:Date.now(),cm:domComments('start')},{h:`Selection Watch: ${p} could be one to watch this season`,b:`${p} has been backed to make an impact as ${t} build their squad around a mix of experience and youth.`,src:'Cricbuzz',d:Date.now(),cm:domComments('watch')}]}
function domComments(k){let sets={start:['Big season ahead for them.','I think they can make the finals.','Not convinced yet, let us see the first few games.','Up the boys! 🔥'],watch:['Finally, give the youngster a proper run.','Could be a breakout season.','Bit early for that call.','I have heard good things about this player.'],win:['Great result, that is exactly what they needed.','Too good today. 🔥','Good win, but it is only one game.','That batting was class.'],loss:['Tough result, but plenty of games left.','They were second best today.','Wake up, the finals race will not wait.','Unlucky, they can bounce back.'],tbl:['Top of the table for a reason.','They are just too good right now.','Long way to go, do not get carried away.','Up the boys! 🔥']};return sets[k].sort(()=>Math.random()-.5).slice(0,3).map((t,i)=>({u:['CoverDriveCam','SlipCordon','BoundaryBen'][i],t,l:100+i*80}))}
function domesticAddNews(h,b,k){G.news.unshift({h,b,src:['Fox Sports','ESPNcricinfo','Wisden','Cricbuzz'][Math.floor(Math.random()*4)],d:Date.now(),cm:domComments(k)});G.news=G.news.slice(0,10)}
function domesticSim(){let d=DOM[G.league],others=d.teams.filter(t=>t!=G.team),opp=others[Math.floor(Math.random()*others.length)],win=Math.random()<.5,S=G.standings;S[G.team].p++;S[opp].p++;G.fanFlash='';if(win){S[G.team].w++;S[G.team].pts+=2;S[opp].l++;G.wins++;G.pts+=2;G.fan=Math.min(100,(G.fan||72)+2)}else{S[opp].w++;S[opp].pts+=2;S[G.team].l++;G.losses++;G.fan=Math.max(0,(G.fan||72)-5);G.fanFlash='-5 Fan Reputation'}G.played++;let tn=G.teamName,on=DT[opp]||opp;if(win)domesticAddNews(tn+' beat '+on+' in an early '+d.short+' statement',tn+' took the points after a convincing performance. Fans are already asking whether this could be a finals-bound side.','win');else domesticAddNews(tn+' lose to '+on+' but remain in the finals race',tn+' will need to respond quickly. It is an early setback, with plenty of cricket still to play.','loss');if(G.played%3==0){let p=G.players[Math.floor(Math.random()*G.players.length)];domesticAddNews('Breakout Watch: '+p+' making an impression for '+tn,p+' has put together a strong run of performances and is starting to attract attention beyond the '+d.short+'.','watch')}if(G.played%14==0){let pos=Object.entries(S).sort((a,b)=>b[1].pts-a[1].pts)[0][0];domesticAddNews((DT[pos]||pos)+' finish top of the '+d.short+' table',(DT[pos]||pos)+' have finished the regular season on top after a consistent campaign.','tbl')}domesticRender()}
function domesticRender(){let S=Object.entries(G.standings).sort((a,b)=>b[1].pts-a[1].pts||b[1].w-a[1].w),n=G.news[0],flash=G.fanFlash?'<span class="fanminus">'+G.fanFlash+'</span>':'';$('#app').innerHTML='<header><div class=logo onclick=start()>CM</div><b class=ttl>'+DOM[G.league].short+'</b><nav><a class=on>Central</a><a onclick=domesticSim()>Simulate Match</a></nav><div class=club><b style="font-size:20px;display:block">'+G.teamName+'</b><small>'+G.manager+'</small></div></header><main><section class=l style="max-width:760px"><div class=row><b>'+G.teamName+'</b> · '+DOM[G.league].name+'<br><em>Season '+G.season+' · Matches '+G.played+' · Record '+G.wins+'-'+G.losses+'</em></div><div class="fanRep '+(G.fanFlash?'fandown':'')+'"><b>Fan Reputation</b><div class=fanBar><i style="width:'+(G.fan||0)+'%"></i></div><b>'+(G.fan||0)+'</b>'+flash+'</div><h2>Standings</h2><div class=panel><table><tr><th>#<th>Team<th>P<th>W<th>L<th>Pts</tr>'+S.map((x,i)=>'<tr class="'+(x[0]==G.team?'me':'')+'"><td>'+(i+1)+'</td><td><div style="display:flex;align-items:center;gap:8px">'+domLogo(x[0])+'<b>'+(DT[x[0]]||x[0])+'</b></div></td><td>'+x[1].p+'</td><td>'+x[1].w+'</td><td>'+x[1].l+'</td><td><b>'+x[1].pts+'</b></td></tr>').join('')+'</table></div><h2>Latest News</h2><div class=card style="width:100%;max-width:700px">'+ncard(n)+'</div></section></main>';setTimeout(()=>{G.fanFlash=''},900)}

const saves=()=>{let a=[];try{for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith('tm27_'))a.push(JSON.parse(localStorage.getItem(k)))}}catch(e){}return a.sort((x,y)=>y.ts-x.ts)};

function ask(msg,fn){let d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:20px';d.innerHTML=`<div class=panel style="max-width:380px;text-align:center;background:#2a1050;margin:0"><h3 style="margin-top:0">Are you sure you want to do this?</h3><p>${msg}</p><button class=go id=cy>Yes</button> <button class=btn id=cn style="padding:10px 28px;font-size:16px">No</button></div>`;document.body.appendChild(d);d.querySelector('#cy').onclick=()=>{d.remove();fn()};d.querySelector('#cn').onclick=()=>d.remove()}

function save(){try{let {xi,...d}=G;d.xiN=Object.fromEntries(FM.map(f=>[f,xi[f].map(p=>p.n)]));d.ts=Date.now();localStorage.setItem('tm27_'+G.id,JSON.stringify(d))}catch(e){}}

function lowpoly(){let W=1600,H=900,c=9,r=6,pts=[];for(let j=0;j<=r;j++)for(let i=0;i<=c;i++)pts.push([Math.round(i*W/c+(i&&i<c?(R()-.5)*W/c*.8:0)),Math.round(j*H/r+(j&&j<r?(R()-.5)*H/r*.8:0))]);
 let t='';for(let j=0;j<r;j++)for(let i=0;i<c;i++){let a=pts[j*(c+1)+i],b=pts[j*(c+1)+i+1],d=pts[(j+1)*(c+1)+i],e=pts[(j+1)*(c+1)+i+1];[[a,b,d],[b,e,d]].forEach(q=>{t+=`<polygon points="${q.map(p=>p.join(',')).join(' ')}" fill="hsl(${262+R()*28} ${35+R()*35}% ${14+R()*30}%)" fill-opacity=".5"/>`})}
 let d=document.createElement('div');d.className='lp';d.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="margin:0;border-radius:0">${t}</svg>`;document.body.prepend(d)}
try{lowpoly()}catch(e){}
start();
