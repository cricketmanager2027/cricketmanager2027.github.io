function renew(i){let p=G.sq[G.me][i],c=rnc(p);if(p.ct>=G.season+2)return toast('Already on a long contract');if(G.funds<c)return toast('Not enough funds');G.funds-=c;p.ct++;toast(p.n+' extended to '+csn(p.ct));render()}
function sellP(i){let p=G.sq[G.me][i];if(G.sq[G.me].length<=14)return toast('Keep at least 14 players');ask('Sell '+p.n+' for $'+slv(p)+'M?',()=>{G.funds+=slv(p);G.sq[G.me].splice(G.sq[G.me].indexOf(p),1);FM.forEach(f=>{G.xi[f]=G.xi[f].filter(z=>z!==p);fixXI(f)});toast(p.n+' sold');render()})}
function domRoll(){let q=G.sq[G.me];q.forEach(p=>{if(p.ct==null)p.ct=G.season});let out=q.filter(p=>p.ct<G.season),inn=G.pend||[];G.sq[G.me]=q.filter(p=>p.ct>=G.season);inn.forEach(p=>{p.ct=G.season+1;G.sq[G.me].push(p)});G.pend=[];while(G.sq[G.me].length<15){let y=mk1(nname(G.me),'BWFSA'[G.sq[G.me].length%5],T[G.me].b-6);y.a=19+~~(R()*3);y.ct=G.season+1;G.sq[G.me].push(y)}FM.forEach(f=>{G.xi[f]=G.xi[f].filter(p=>G.sq[G.me].includes(p));fixXI(f)});G.news.unshift(story(G.me,`${T[G.me].n} squad changes for ${csn(G.season)}`,`In: ${inn.map(p=>p.n).join(', ')||'none'}. Out: ${out.map(p=>p.n).join(', ')||'none'}.`,'Fox Sports'))}
const XN=(c,n,o,a,b)=>G.dom?[[`${n} dominate the ${G.dl} powerplay`,`Analysts say ${a} and ${b} give ${n} the most reliable start in the competition.`,'Fox Sports'],[`${G.dl} overseas market heats up`,`Franchises are chasing power hitters as budgets stretch and signing windows tighten.`,'ESPNcricinfo'],[`${n} v ${o}: the rivalry fans cannot get enough of`,`Packed stands and a sold-out atmosphere are expected for the next meeting.`,'Cricbuzz'],[`Death overs decide the ${G.dl} finals race`,`Data shows the last four overs have swung more results than any other phase this season.`,'Wisden'],[`${n} coach weighs experience against youth`,`With ${b} pushing for a bigger role, the franchise faces a selection call before the knockouts.`,'cricket.com.au'],[`Fan zone: ${n} supporters split on the top-four race`,`Social media is divided over whether ${n} have the depth to go all the way.`,'Sky Sports Cricket']]:[[`Tactical breakdown: how ${n} are using ${a}`,`Coaches have shifted ${a} up the order and the numbers show a clear impact.`,'Wisden'],[`Workload watch: ${n} quicks under pressure`,`A heavy schedule means rotation is likely, with ${b} tipped to come in.`,'ESPNcricinfo'],[`${n} and ${o} clash over scheduling`,`Boards remain at odds over the calendar as the next series approaches.`,'ICC'],[`Home advantage: is it still real for ${n}?`,`A look at ten years of results suggests pitches and crowds still tilt matches.`,'The Guardian'],[`Rankings shake-up could favour ${n}`,`A strong series would lift ${n} in all three formats, with ${a} central to the push.`,'ICC'],[`Selectors target depth after ${n} injury concerns`,`Two squad spots are open and ${b} is among the names under discussion.`,'Cricbuzz']];
function nameG(){$('#app').innerHTML=`<main><section class=l style="max-width:560px"><h2>Create Your Character</h2><div class=panel><b>Your name</b><br><input id=pn maxlength=20 placeholder="Enter your name" value="${PN}" style="font:inherit;font-size:22px;padding:10px 14px;margin-top:10px;width:100%;background:#2a1050;color:#fff;border:1px solid #fff5;border-radius:8px"></div><button class=btn onclick=start()>← Back</button> <button class=go onclick=nameNext()>Next</button></section></main>`;let n=$('#pn');n.focus();n.onkeydown=e=>{if(e.key=='Enter')nameNext()}}
function nameNext(){let v=$('#pn').value.replace(/[<>&"'`]/g,'').trim();if(!v)return toast('Enter your name first');PN=v;modeSelect()}
function newG(){$('#app').innerHTML=`<main><section class=l style="max-width:860px"><h2>Select Your Nation</h2><p>Head coach: <b>${PN}</b></p><div class=grid>${C.map(c=>`<div class="tm ${SEL==c?'act2':''}" onclick="SEL='${c}';newG()">${flag(c,70)}<br>${T[c].n}<br><em>Team rating ${rt(c)}</em></div>`).join('')}</div><p style="margin-top:20px"><button class=btn onclick=modeSelect()>← Back</button> <button class=go ${SEL?'':'disabled'} onclick="pick(SEL)">Begin</button></p></section></main>`}
const saves=()=>{let a=[];try{for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);if(k&&k.startsWith('tm27_'))a.push(JSON.parse(localStorage.getItem(k)))}}catch(e){}return a.sort((x,y)=>y.ts-x.ts)};
function lsv(){$('#app').innerHTML=`<main><section class=l style="max-width:760px"><h2>Continue Career</h2>${saves().map(d=>`<div class=panel style="display:flex;align-items:center;gap:14px">${flag(d.me,50)}<div style=flex:1><b>${d.mn||'Coach'} · ${T[d.me].n}</b><br><em>Season ${d.season} · ${new Date(d.ts).toLocaleString()}</em></div><button class=btn onclick="ld(${d.id})">Load</button><button class=btn onclick="askDl(${d.id})">Delete</button></div>`).join('')||'<p>No saves yet.</p>'}<button class=btn onclick=start()>← Back</button></section></main>`}
function ld(id){try{let d=JSON.parse(localStorage.getItem('tm27_'+id));setMode(d.dl);G=d;G.nw=0;G.mn=G.mn||'Coach';G.fan=G.fan??50;window.FP=null;G.ss=G.ss||{};G.u.m=G.u.m||0;G.u.s=G.u.s||0;G.cp=0;G.xi={};FM.forEach(f=>G.xi[f]=d.xiN[f].map(n=>G.sq[G.me].find(p=>p.n==n)).filter(Boolean));M=null;G.fm=G.fm||{};G.tro=G.tro||[];G.log=G.log||[];G.ps=G.ps||{};G.sid=G.sid||50;G.fx.forEach((f,i)=>{if(f.n==null){f.n=2;f.sid=i>>1}if(!f.d)f.d=G.d});G.cal=G.cal||[];G.yr=G.yr||'';G.obj=G.obj||genObjs();render()}catch(e){toast('Could not load this save.')}}
function resume(){let f=G.fx[G.fi],r=FM.map(x=>x+' '+ord(rk(x).indexOf(G.me)+1)).join(' · ');$('#app').innerHTML=`<main><section class=l style="max-width:640px"><h2>Where You Left Off</h2><div class=panel style="text-align:center">${flag(G.me,120)}<h2>${T[G.me].n}</h2><em>Head coach · Season ${G.season} · ${dt(G.d)}</em></div><div class=panel><b>Next match</b><br>${f.ev} · ${f.f} ${f.g} of 2<br>${flag(f.o)}${T[f.o].n}<br><em>${sl()}</em></div><div class=panel><b>Standings:</b> ${r}<br><b>Board confidence</b> ${G.conf}% · <b>Funds</b> $${G.funds.toFixed(1)}M<br><em>Record (W-D-L): ${FM.map(x=>x+' '+G.rec[x].join('-')).join(' · ')}</em></div><button class=btn onclick=lsv()>← Back</button> <button class=go onclick=render()>Resume Career</button></section></main>`}
function ask(msg,fn){let d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:20px';d.innerHTML=`<div class=panel style="max-width:380px;text-align:center;background:#2a1050;margin:0"><h3 style="margin-top:0">Are you sure you want to do this?</h3><p>${msg}</p><button class=go id=cy>Yes</button> <button class=btn id=cn style="padding:10px 28px;font-size:16px">No</button></div>`;document.body.appendChild(d);d.querySelector('#cy').onclick=()=>{d.remove();fn()};d.querySelector('#cn').onclick=()=>d.remove()}
const askDl=id=>ask('This will permanently delete this career.',()=>dl(id)),askRt=i=>ask('This will retire '+G.sq[G.me][i].n+' from '+G.sf+' cricket only.',()=>rtr(i));
function dl(id){try{localStorage.removeItem('tm27_'+id)}catch(e){}lsv()}
function save(){try{let {xi,...d}=G;d.xiN=Object.fromEntries(FM.map(f=>[f,xi[f].map(p=>p.n)]));d.ts=Date.now();localStorage.setItem('tm27_'+G.id,JSON.stringify(d))}catch(e){}}
function home(){if(M)return toast('Finish the match first.');save();start()}
function lowpoly(){let W=1600,H=900,c=9,r=6,pts=[];for(let j=0;j<=r;j++)for(let i=0;i<=c;i++)pts.push([Math.round(i*W/c+(i&&i<c?(R()-.5)*W/c*.8:0)),Math.round(j*H/r+(j&&j<r?(R()-.5)*H/r*.8:0))]);
 let t='';for(let j=0;j<r;j++)for(let i=0;i<c;i++){let a=pts[j*(c+1)+i],b=pts[j*(c+1)+i+1],d=pts[(j+1)*(c+1)+i],e=pts[(j+1)*(c+1)+i+1];[[a,b,d],[b,e,d]].forEach(q=>{t+=`<polygon points="${q.map(p=>p.join(',')).join(' ')}" fill="hsl(${262+R()*28} ${35+R()*35}% ${14+R()*30}%)" fill-opacity=".5"/>`})}
 let d=document.createElement('div');d.className='lp';d.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" style="margin:0;border-radius:0">${t}</svg>`;document.body.prepend(d)}
try{lowpoly()}catch(e){}
start();
</script></body></html>
